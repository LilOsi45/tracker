# Reverse proxy for the tracker. Terminate TLS here (certbot), proxy to
# uvicorn on localhost.
#
#   ln -s /opt/tracker/deploy/nginx.conf /etc/nginx/sites-enabled/tracker
#   certbot --nginx -d tracker.example.de

server {
    listen 443 ssl http2;
    server_name tracker.example.de;

    # certbot fills these in
    # ssl_certificate     /etc/letsencrypt/live/tracker.example.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/tracker.example.de/privkey.pem;

    # A service worker may only control the scope it is served from, and it
    # must not be cached or an update never reaches the phone.
    location = /sw.js {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The first wallet sync walks a long history.
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name tracker.example.de;
    return 301 https://$host$request_uri;
}
