# Reverse proxy for the tracker.
#
# Deliberately HTTP-only. `certbot --nginx` rewrites this file in place: it
# adds the TLS server block, the certificate paths and the 80 -> 443
# redirect once a certificate actually exists.
#
# Do not pre-write `listen 443 ssl` here. Without a certificate on disk nginx
# refuses to start at all ("no ssl_certificate is defined"), and a premature
# redirect to HTTPS also stops certbot from answering its own HTTP-01
# challenge — so the config that is supposed to get you a certificate is the
# reason you cannot get one.
#
#   sed -i 's/tracker.example.de/deine.domain.de/' nginx.conf
#   ln -s /opt/tracker/deploy/nginx.conf /etc/nginx/sites-enabled/tracker
#   certbot --nginx -d deine.domain.de

server {
    listen 80;
    listen [::]:80;
    server_name tracker.example.de;

    # A service worker only controls the scope it is served from, and it must
    # never be cached or an update never reaches the phone.
    location = /sw.js {
        proxy_pass http://127.0.0.1:8000;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The first wallet sync walks a long history.
        proxy_read_timeout 300s;
    }
}
